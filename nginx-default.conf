# nginx site config for the llama.cpp dashboard container.
# Serves the static terminal page and same-origin-proxies the llama-server
# API. AUTHENTICATION IS INJECTED HERE: the generated snippet
# /etc/nginx/secrets/auth.conf contains one line,
#   proxy_set_header Authorization "Bearer <key-from-this-startup>";
# and is included below. The browser therefore needs no API key at all.
#
# SECURITY NOTES:
#  - Deliberately NO Access-Control-Allow-* headers anywhere. Adding CORS
#    headers to this proxy would let ANY WEBSITE YOU VISIT call the API
#    (auth is injected server-side, so a foreign page's fetch would be
#    authenticated too). Do not add CORS headers. Browsers enforce
#    same-origin by absence, which is the intended posture.
#  - limit_req caps accidental/self-inflicted DoS from local processes:
#    sustained >10 req/s gets 429'd; bursts up to 20 queue slots pass
#    un-delayed. Streaming responses are unaffected (rate is per-request,
#    not per-chunk).

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # API proxy — MINIMAL WHITELIST: only what the dashboard consumes.
    # (/slots, /props, /completion, /tokenize, /embedding etc. are
    # intentionally NOT exposed; do not widen without a concrete need.)
    location ~ ^/(v1|models|health)(/|$) {
        proxy_pass http://llama-server:8080;
        proxy_http_version 1.1;

        # --- auth: injected from the per-startup rotated key file ---
        include /etc/nginx/secrets/auth.conf;

        # --- abuse containment (loopback noisy neighbors) ---
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        # SSE/streaming: no buffering, no keepalive teardown
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # cold GGUF loads can take minutes; don't cut the stream
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        proxy_set_header Host $host;
    }

    # everything else: 404 instead of leaking nginx defaults
    location / {
        return 404;
    }
}
